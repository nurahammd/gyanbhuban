<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>জ্ঞানভুবন | অনলাইন লাইব্রেরি</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#f5f6f2;
 color:#26352e;
 font-family:Arial,sans-serif;
}
header{
 background:#123c30;
 color:white;
 padding:16px;
 text-align:center;
}
header h1{margin:0;font-size:28px}
header p{margin:5px}
.banner{
 width:100%;
 display:block;
}
main{
 max-width:1000px;
 margin:auto;
 padding:22px;
}
.heading{
 display:flex;
 justify-content:space-between;
 align-items:center;
 flex-wrap:wrap;
 gap:12px;
}
.search{
 width:100%;
 max-width:350px;
 padding:13px;
 border:1px solid #ddd;
 border-radius:25px;
 font-size:16px;
}
.books{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:18px;
 margin-top:22px;
}
.book{
 background:white;
 padding:15px;
 border-radius:13px;
 text-align:center;
 box-shadow:0 3px 12px #00000010;
}
.cover{
 height:220px;
 background:#e6ebe5;
 display:flex;
 justify-content:center;
 align-items:center;
 color:#52735f;
 border-radius:8px;
 font-size:20px;
}
.book h3{color:#234b3b}
.book p{line-height:1.5;color:#68756d}
.price{color:#234b3b;font-weight:bold}
button{
 background:#15533c;
 color:white;
 border:0;
 border-radius:8px;
 padding:12px;
 width:100%;
 font-size:16px;
}
footer{
 background:#123c30;
 color:white;
 text-align:center;
 padding:25px;
 margin-top:35px;
}
</style>
</head>

<body>

<header>
<h1>জ্ঞানভুবন</h1>
<p>জ্ঞান ও পাঠের এক নতুন জগৎ</p>
</header>

<img class="banner" src="banner.png" alt="জ্ঞানভুবন ব্যানার">

<main>
<div class="heading">
<h2>আমাদের বইয়ের সংগ্রহ</h2>
<input class="search" id="search"
placeholder="বইয়ের নাম লিখে খুঁজুন..."
oninput="searchBooks()">
</div>

<div class="books">

<div class="book">
<div class="cover">বইয়ের প্রচ্ছদ</div>
<h3>স্বাগতম জ্ঞানভুবনে</h3>
<p>লেখক: জ্ঞানভুবন</p>
<div class="price">বিনামূল্যে</div>
<br>
<button>বই পড়ুন</button>
</div>

</div>
</main>

<footer>
জ্ঞানভুবন · একটি স্বাধীন ডিজিটাল লাইব্রেরি
</footer>

<script>
function searchBooks(){
 const value=document.getElementById("search").value.toLowerCase();
 document.querySelectorAll(".book").forEach(book=>{
  book.style.display=book.innerText.toLowerCase().includes(value)?"block":"none";
 });
}
</script>

</body>
</html>
